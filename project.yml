name: ContinentalExplorer
options:
  bundleIdPrefix: com.continentalexplorer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: ContinentalExplorer/Info.plist

targets:
  ContinentalExplorer:
    type: application
    platform: iOS
    sources:
      - ContinentalExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.continentalexplorer.app
        INFOPLIST_FILE: ContinentalExplorer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: ContinentalExplorer/Info.plist
      properties:
        CFBundleDisplayName: Continental Explorer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Continental Explorer needs your location for navigation and speed alerts."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Continental Explorer needs continuous location access for background navigation and radar alerts."
        NSCameraUsageDescription: "Continental Explorer uses the camera for AR navigation overlay."

  ContinentalExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ContinentalExplorerTests
    dependencies:
      - target: ContinentalExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.continentalexplorer.tests
